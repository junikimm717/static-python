services:
  spython:
    image: ghcr.io/junikimm717/static-python/spython:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    # binfmt_misc lives under /proc/sys, read-only unless privileged. The
    # table is the host kernel's, so this registers qemu for the whole
    # machine. "already registered" in `docker compose logs` is harmless.
    privileged: true
    # Default docker nofile is 1024; parallel configure/LTO links blow through it.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    entrypoint: /bin/sh -c "binfmt start; trap 'exit 0' TERM; while :; do sleep 1; done"
    tty: true
