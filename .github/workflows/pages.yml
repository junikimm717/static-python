name: Pages

# Pages is generated from the committed benchmarks/ tree. Never invoke
# ./staticpy bench or ./staticpy build here: ubuntu-latest is not the
# measurement machine, and a CI geomean would not be comparable to anything.

on:
  push:
    branches: [master]
    paths:
      - "benchmarks/**"
      - "manage_benchmarks.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "manage_benchmarks.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive
        run: python3 manage_benchmarks.py verify
      - name: Generate site
        run: python3 manage_benchmarks.py site --out _site
      # PRs prove the generator without requiring Pages to be enabled on the
      # repo; production deploys upload the Pages artifact.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
