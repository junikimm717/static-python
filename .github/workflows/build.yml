name: Static Python Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

jobs:
  # The matrix comes from targets.toml rather than a list here, so adding a
  # triple is still a one-row change.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: list
        run: |
          printf 'matrix=' >> "$GITHUB_OUTPUT"
          ./staticpy print targets-all \
            | tr ' ' '\n' | grep . | jq -Rrn '[inputs] | tostring' >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # One bad target must not abandon the ten that were fine.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # busybox supplies sh/awk/sed to the hermetic builds; qemu-user runs the
      # cross-built interpreter so --verify has something to verify on.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static qemu-user perl patch
          sudo ln -sf /bin/busybox /usr/local/bin/busybox

      # Toolchains are fetched by the ./staticpy shim from gccfactory; nothing
      # is compiled here except CPython and its dependencies.
      - name: Build, verify and pack
        run: ./staticpy build --target ${{ matrix.target }} --verify core --pack

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: dist/out/default/${{ matrix.target }}/
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built, rather than nothing when one target regressed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: python-*
          merge-multiple: true

      - name: Delete release
        run: |
          gh release delete binaries --yes || true
          git push origin :binaries || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: binaries
          name: "Latest Static Binaries"
          body_path: .github/workflows/notes.md
          files: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          draft: false
          prerelease: true
