# Sets of Python packages compiled into the interpreter as builtins. A static
# interpreter cannot dlopen an extension, so a C module either arrives this way
# or not at all.
#
# Bundles are a later phase; nothing is defined yet. A bundle names keys from
# [pkg.*], which no config file declares so far.
#
# [pkg.charset_normalizer]
# name = "charset_normalizer"
# version = "3.4.0"
# sdist_sha256 = "..."
# urls = ["https://files.pythonhosted.org/.../charset_normalizer-3.4.0.tar.gz"]
# [[pkg.charset_normalizer.modules]]
# name = "charset_normalizer.md"
# sources = ["src/charset_normalizer/md.c"]
#
# [bundle.requests]
# packages = ["charset_normalizer", "idna", "urllib3", "certifi", "requests"]
