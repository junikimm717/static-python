[bench]
pyperformance = "1.14.0"
pyperf = "2.10.0"

# Sdists shipped inside a kit so the quiet box can install the suite
# without git, and without PyPI for these two packages. Per-benchmark
# requirements may still hit the network.
[bench.vendor.pyperformance]
file = "pyperformance-1.14.0.tar.gz"
sha256 = "91f74393997b604375ad5b79bf569a24076d70181c076a53abad5383a238a8aa"
urls = ["https://files.pythonhosted.org/packages/9e/bc/ebc48f2af24abe0d13681ac7ccb21c3f0ed0128361522f5904d4f21953e9/pyperformance-1.14.0.tar.gz"]

[bench.vendor.pyperf]
file = "pyperf-2.10.0.tar.gz"
sha256 = "dd93ccfda79214725293e95f1fa6e00cb4a64adcf1326039486d4e1f91caaa62"
urls = ["https://files.pythonhosted.org/packages/16/91/39ca77aa58f13e8c65d747ac7e06584b55acabfa98987fb8d546bc24860d/pyperf-2.10.0.tar.gz"]

# Several already-built interpreters plus a runner. `staticpy kit` packs
# [kit.default]; `staticpy kit --name smoke` is the two-arm check.
[kit.default]
baseline = "reference"
arms = [
  "default",
  "nomimalloc",
  "nolto",
  "nolto-nomimalloc",
  "seplto",
  "seplto-nomimalloc",
  "reference",
  "reference-nolto",
  "reference-mimalloc",
  "reference-nolto-mimalloc",
]

[kit.smoke]
baseline = "reference"
arms = ["default", "reference"]
