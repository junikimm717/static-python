sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

# Narrow closure returns come back as the high half of the slot on big-endian
# n32/n64; see .agents/skills/staticpy-traps/references/MIPS64_FFI_REPORT.md.
# Keyed to the one affected target rather than listed in patches, which would
# move every target's key for a fix that changes nothing anywhere else.
[source.libffi.target_patches]
mips64-linux-musl = ["0001-narrow-closure-returns-on-big-endian-mips.diff"]

