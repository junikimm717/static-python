# Pinned upstream inputs. This file and patches/ are deliberately NOT part of
# the automatic overlay: they come from the copy embedded in the binary unless
# --sources is passed explicitly, so a stray config/ directory cannot redefine
# a checksum. See Load.
#
# A version and its sha256 move in the same edit; a pin without its checksum is
# a build that fetches an unverified tarball. Mirrors are only listed where the
# mirrored file is known to be byte-identical to the primary -- a mirror serving
# a different tarball is a failed checksum, not a fallback.

[source.openssl]
name = "openssl"
version = "3.5.8"
file = "openssl-3.5.8.tar.gz"
topdir = "openssl-3.5.8"
urls = [
  "https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz",
  "https://www.openssl.org/source/openssl-3.5.8.tar.gz",
]
sha256 = "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2"

# Configure reads -static in LDFLAGS as a signal to turn static, pic and
# threads *off* -- the opposite of what we mean by it.
patches = ["0001-keep-static-with-static-ldflags.diff"]

