# ctypes assumes a libdl underneath it. A fully static interpreter has none, so
# the three edits below replace dlopen-based access to the interpreter's own
# symbols with a table generated into the binary (Modules/staticapi).
# text_file paths are relative to patches/<name>-<version>/.
[[source.python.edits]]
file = "Lib/ctypes/__init__.py"
anchor = "################################################################"
action = "insert_after"
text_file = "ctypes_patch_1.py"
why = "StaticCDLL has to exist before the CDLL block that follows this banner."

[[source.python.edits]]
file = "Lib/ctypes/__init__.py"
anchor = "    pythonapi = PyDLL(None)"
action = "insert_after"
text_file = "ctypes_patch_2.py"
why = "PyDLL(None) is dlopen(NULL); rebind pythonapi onto the static symbol table."

[[source.python.edits]]
file = "Lib/ctypes/__init__.py"
anchor = "    from _ctypes import dlopen as _dlopen"
action = "replace_line"
text = "    _dlopen = lambda *a, **kw: 0"
why = """
_ctypes is built without dlopen support, so importing the name fails at \
module import time and takes all of ctypes with it. Stubbing it keeps \
CDLL/PyDLL importable; they simply cannot load anything.\
"""
