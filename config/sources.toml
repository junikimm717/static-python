# bzip2 has no configure. Its Makefile hardcodes a host toolchain, so every
# assignment we need to come from the environment has to stop being a makefile
# assignment first: make lets the environment beat a builtin default but never
# an explicit `VAR=` in the makefile.
[[source.bzip2.edits]]
file = "Makefile"
anchor = "CC=gcc"
action = "delete_line"
why = "Hardcoded host gcc; the cross CC is exported by the environment."

[[source.bzip2.edits]]
file = "Makefile"
anchor = "AR=ar"
action = "delete_line"
why = "Must be the toolchain's gcc-ar so LTO archives carry their plugin index."

[[source.bzip2.edits]]
file = "Makefile"
anchor = "RANLIB=ranlib"
action = "delete_line"
why = "Same as AR: a host ranlib cannot index slim LTO objects."

[[source.bzip2.edits]]
file = "Makefile"
anchor = "CFLAGS=-Wall -Winline -O2 -g $(BIGFILES)"
action = "delete_line"
why = "Would drop the profile's -O3/-flto and re-add -g on a stripped build."

[[source.bzip2.edits]]
file = "Makefile"
anchor = "LDFLAGS="
action = "delete_line"
why = "Empties the -static/--gc-sections link flags the profile sets."

[[source.bzip2.edits]]
file = "Makefile"
anchor = "PREFIX=/usr/local"
action = "delete_line"
why = "install would write outside the artifact; PREFIX comes from the job."

