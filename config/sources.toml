# Pinned upstream inputs. This file and patches/ are deliberately NOT part of
# the automatic overlay: they come from the copy embedded in the binary unless
# --sources is passed explicitly, so a stray config/ directory cannot redefine
# a checksum. See Load.
#
# sha256 values are the ones in hashes/*.sha256; they are what the Makefile
# has been verifying against. Mirrors are only listed where the mirrored file
# is known to be byte-identical to the primary -- a mirror serving a different
# tarball is a failed checksum, not a fallback.

[source.openssl]
name = "openssl"
version = "3.5.6"
file = "openssl-3.5.6.tar.gz"
topdir = "openssl-3.5.6"
urls = [
  "https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz",
  "https://www.openssl.org/source/openssl-3.5.6.tar.gz",
]
sha256 = "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"

# Configure reads -static in LDFLAGS as a signal to turn static, pic and
# threads *off* -- the opposite of what we mean by it.
patches = ["0001-keep-static-with-static-ldflags.diff"]

